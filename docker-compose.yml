services:
  rcon-panel:
    build: .
    image: minecraft-rcon-panel:latest
    container_name: minecraft-rcon-panel
    restart: unless-stopped
    env_file: .env
    volumes:
      # SSH key for talking to the QNAP host. The Dockerfile creates the
      # `app` user with $HOME=/home/app; don't mount into /root any more.
      - ~/.ssh/minecraft_panel_rsa:/home/app/.ssh/minecraft_panel_rsa:ro
      - ~/.ssh/minecraft_panel_rsa.pub:/home/app/.ssh/minecraft_panel_rsa.pub:ro
      # Persistent app state (auto-generated secret key, scheduled tasks).
      - ./data:/app/data
    ports:
      - "41114:5000"
    cpus: 0.5
    mem_limit: 256m
    # No docker.sock — the panel controls bedrock by SSH+docker exec via
    # the mounted key, not via a local Docker API.
